apiVersion: apps/v1
kind: Deployment

metadata:
  name: payflow
  namespace: payflow
  labels:
    app: payflow

spec:
  # Baseline replica count.
  # HPA can scale this between 2 and 5.
  replicas: 3

  # A new pod must remain Ready for this duration
  # before Kubernetes considers it Available.
  minReadySeconds: 10

  # Fail the rollout if it cannot make progress within 5 minutes.
  progressDeadlineSeconds: 300

  # Keep the five most recent ReplicaSets for rollback/history.
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: payflow

  # Zero-downtime rolling deployment.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  template:
    metadata:
      labels:
        app: payflow

    spec:
      serviceAccountName: payflow
      automountServiceAccountToken: false

      # Give Spring Boot time to finish graceful shutdown.
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U myuser -d mydb; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: payflow-secret
                  key: POSTGRES_USER

      containers:
        - name: payflow
          image: payflow:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # PostgreSQL
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mydb

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payflow-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payflow-secret
                  key: POSTGRES_PASSWORD

            # Redis
            - name: SPRING_DATA_REDIS_HOST
              value: redis

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payflow-secret
                  key: JWT_SECRET

            # Razorpay
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payflow-secret
                  key: RAZORPAY_KEY_ID

            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: payflow-secret
                  key: RAZORPAY_KEY_SECRET

            # Timezone
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: payflow-config
                  key: TZ

          volumeMounts:
            - name: application-logs
              mountPath: /app/logs

          # ---------------------------------------------------------
          # STARTUP PROBE
          # ---------------------------------------------------------
          # Prevents normal Spring Boot startup time from being
          # interpreted as a readiness failure.
          #
          # Maximum startup window:
          # 24 failures × 5 seconds = 120 seconds
          # ---------------------------------------------------------
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 35
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
            successThreshold: 1

          # ---------------------------------------------------------
          # READINESS PROBE
          # ---------------------------------------------------------
          # Controls whether the pod receives Service traffic.
          # This only starts being evaluated after startupProbe succeeds.
          # ---------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          # ---------------------------------------------------------
          # LIVENESS PROBE
          # ---------------------------------------------------------
          # Detects an application that has become unhealthy after
          # successful startup and allows Kubernetes to restart it.
          # ---------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ---------------------------------------------------------
          # RESOURCE MANAGEMENT
          # ---------------------------------------------------------
          resources:
            requests:
              cpu: 200m
              memory: 512Mi

            limits:
              cpu: 1000m
              memory: 1Gi

      volumes:
        - name: application-logs
          persistentVolumeClaim:
            claimName: payflow-logs-pvc