apiVersion: skaffold/v4beta13
kind: Config

metadata:
  name: payflow

build:
  artifacts:
    - image: payflow
      docker:
        dockerfile: Dockerfile

      hooks:
        before:
          - command:
              - cmd.exe
              - /C
              - mvnw.cmd
              - test
            os:
              - windows

  local:
    push: false

manifests:
  rawYaml:
    # Namespace and persistent storage are intentionally managed
    # outside Skaffold so `skaffold delete` does not destroy data.
    - k8s/config/*.yaml

    # PayFlow application
    - k8s/payflow/deployment.yaml
    - k8s/payflow/service.yaml
    - k8s/payflow/hpa.yaml
    - k8s/payflow/pdb.yaml
    - k8s/payflow/serviceAccount.yaml

    # PostgreSQL
    - k8s/postgres/deployment.yaml
    - k8s/postgres/service.yaml

    # Redis
    - k8s/redis/deployment.yaml
    - k8s/redis/service.yaml

    # Gateway
    - k8s/gateway/*.yaml

deploy:
  kubectl: {}