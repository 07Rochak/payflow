<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFlow - Razorpay Test Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            width: min(520px, 92vw);
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }
        h1 { margin: 0 0 6px; }
        .subtitle { color: #6b7280; margin-bottom: 24px; }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin: 14px 0 6px;
        }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #f3f4f6;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }
        .success { background: #ecfdf5; }
        .error { background: #fef2f2; }
        .step {
            font-size: 13px;
            color: #6b7280;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>PayFlow</h1>
    <div class="subtitle">Razorpay Test-Mode Wallet Top-Up</div>

    <label for="email">PayFlow Email</label>
    <input id="email" type="email" placeholder="your-test-user@email.com">

    <label for="password">PayFlow Password</label>
    <input id="password" type="password" placeholder="Password">

    <label for="amount">Amount (INR)</label>
    <input id="amount" type="number" min="1" step="1" value="100">

    <button id="payButton" onclick="startPayment()">Pay with Razorpay</button>

    <div id="status" class="status">Ready.</div>
    <div class="step">
        Flow: Login → Create PayFlow Payment → Create Razorpay Order → Checkout → Verify → Wallet Credit.
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080";
    const keyId = "rzp_test_SuUQMBpgsib54Y";

    let accessToken = null;
    let payflowPaymentId = null;
    let razorpayOrderId = null;

    const statusBox = document.getElementById("status");
    const payButton = document.getElementById("payButton");

    function setStatus(message, type = "") {
        statusBox.textContent = message;
        statusBox.className = "status " + type;
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(API_BASE + url, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        const text = await response.text();
        let data;

        try {
            data = text ? JSON.parse(text) : null;
        } catch {
            data = text;
        }

        if (!response.ok) {

        const error = new Error(
             typeof data === "string"
                    ? data
                    : JSON.stringify(data, null, 2)
        );
            error.status = response.status;
            throw error;
        }

        return data;
    }

    async function login() {
        setStatus("1/4  Logging in...");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try{
        const data = await apiRequest("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password })
        });

        accessToken = data.accessToken;

        if (!accessToken) {
            throw new Error("Login succeeded but accessToken was not returned.");
        }
        } catch(error) {
            throw new Error("Login failed: " + error.message);
        }
    }

    async function createPayment() {
        setStatus("2/4  Creating PayFlow payment and Razorpay order...");

        const amount = Number(document.getElementById("amount").value);

        if (!amount || amount <= 0) {
            throw new Error("Enter a valid amount.");
        }

        try{
        const data = await apiRequest("/api/payments/create-order", {
            method: "POST",
            headers: {
                Authorization: "Bearer " + accessToken
            },
            body: JSON.stringify({ amount })
        });

        payflowPaymentId = data.paymentId;
        razorpayOrderId = data.orderId;

        if (!payflowPaymentId || !razorpayOrderId) {
            throw new Error(
                "Create-order response did not contain paymentId/orderId:\n" +
                JSON.stringify(data, null, 2)
            );
        }

        return data;

        } catch (error) {
            if (error.status === 401) {
                throw new Error(
                    "Razorpay authentication failed. Check the server credentials."
                );
            }

            if (error.status >= 500) {
                throw new Error(
                    "Razorpay is currently unavailable. Please try again."
                );
            }

            throw new Error(
                "Unable to create Razorpay order.\n\n" +
                error.message
            );
        }
    }

    function openRazorpayCheckout(order) {
        return new Promise((resolve, reject) => {
            setStatus("3/4  Opening Razorpay Checkout...");

            const options = {
                key: keyId,
                amount: order.amount,
                currency: order.currency,
                name: "PayFlow",
                description: "PayFlow Wallet Top-Up",
                order_id: order.orderId,

                handler: function (response) {
                    resolve(response);
                },

                modal: {
                    ondismiss: function () {
                        reject(new Error("Razorpay Checkout was closed."));
                    }
                }
            };

            const razorpay = new Razorpay(options);

            razorpay.on("payment.failed", function (response) {
                const error = response.error || {};
                reject(new Error(
                    "Razorpay payment failed.\n" +
                    "Code: " + (error.code || "N/A") + "\n" +
                    "Description: " + (error.description || "Unknown")
                ));
            });

            razorpay.open();
        });
    }

    async function verifyPayment(response) {
        setStatus("4/4  Verifying payment signature and crediting wallet...");

        const data = await apiRequest("/api/payments/verify", {
            method: "POST",
            headers: {
                Authorization: "Bearer " + accessToken
            },
            body: JSON.stringify({
                razorpayOrderId: response.razorpay_order_id,
                razorpayPaymentId: response.razorpay_payment_id,
                razorpaySignature: response.razorpay_signature
            })
        });

        return data;
    }

    async function startPayment() {
        payButton.disabled = true;

        try {
            await login();

            const order = await createPayment();

            const razorpayResponse = await openRazorpayCheckout(order);

            console.log("Razorpay success response:", razorpayResponse);

            const verificationResponse = await verifyPayment(razorpayResponse);

            setStatus(
                "Payment successful!\n\n" +
                "PayFlow Payment ID: " + payflowPaymentId + "\n" +
                "Razorpay Order ID: " + razorpayResponse.razorpay_order_id + "\n" +
                "Razorpay Payment ID: " + razorpayResponse.razorpay_payment_id + "\n\n" +
                "Backend response: " +
                (typeof verificationResponse === "string"
                    ? verificationResponse
                    : JSON.stringify(verificationResponse, null, 2)),
                "success"
            );

        } catch (error) {
            console.error("Payflow payment flow failed: ", error);

            setStatus(
                "Payment flow failed.\n\n" + error.message,
                "error"
            );
        } finally {
            payButton.disabled = false;
        }
    }
</script>
</body>
</html>
