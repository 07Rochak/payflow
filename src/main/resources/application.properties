spring.application.name=payflow

#postgresql setup
spring.datasource.url = jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=myuser
spring.datasource.password=mypassword

#postgresql driver
spring.datasource.driver-class-name = org.postgresql.Driver

#jpa setup
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL (optional, good for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#security features
jwt.secret=payflowSecretKeyForJwtAuthenticationVerySecure123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=86400000
jwt.refresh-expiration=604800000

#razorpay details
razorpay.key.id=rzp_test_SuUQMBpgsib54Y
razorpay.key.secret=w5nki8T5Nds60JVDhkMaFLIY

#Actuator properties
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Application information
management.info.env.enabled=true
info.app.name=PayFlow
info.app.description=Payment Orchestration API
info.app.version=1.0.0

