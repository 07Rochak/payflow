payflow:
  wallet:
    limits:
      max-balance: 100000
      daily-transfer-limit: 25000
      daily-withdrawal-limit: 10000
  session:
    refresh-token-ttl: 604800 #7 days
    max-session-lifetime: 2592000 #30 days
  security:
    session:
      max-active-sessions: 5
      clock-drift-tolerance-seconds: 60
      validate-device: true
      validate-ip: true